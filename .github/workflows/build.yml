name: build
# Push a tag like v1.0.0 to publish a GitHub Release with VoxSetup.exe (Windows) and Vox.apk (Android).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13' }
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -q
      - name: Documentation matches the code
        run: python documentation/tools/check_docs.py

  relay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-24.04-arm, python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install pytest
      - name: Relay tests (standard library only)
        run: python -m pytest -q -p no:cacheprovider tests/test_relay.py tests/test_relay_admin.py tests/test_relay_proxy.py

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13' }
      - name: Add Google sign-in client (from the GOOGLE_CLIENT_JSON repository secret)
        working-directory: windows
        shell: pwsh
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if ($env:GOOGLE_CLIENT_JSON) { $env:GOOGLE_CLIENT_JSON | Out-File -Encoding utf8NoBOM google_client.json; "Google sign-in enabled" } else { "No GOOGLE_CLIENT_JSON secret: building without Google sign-in" }
      - name: Tests that need the Windows packages (ui_app, engine, Improve privacy gate)
        shell: pwsh
        run: |
          pip install -r windows/requirements.txt pytest==9.1.1
          python -m pytest -q -p no:cacheprovider
      - name: Build Vox.exe
        working-directory: windows
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3
          $g = if (Test-Path google_client.json) { @("--add-data", "google_client.json;.") } else { @() }
          pyinstaller @g --noconfirm --clean --onedir --windowed --name Vox --icon vox.ico `
            --add-data "ui;ui" --add-data "vox.ico;." `
            --hidden-import pystray._win32 --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 `
            --paths ../relay --hidden-import relay `
            --collect-data soundcard --collect-data tzdata --collect-submodules recurring_ical_events `
            --exclude-module PIL._avif --exclude-module PIL.AvifImagePlugin --exclude-module PIL._webp --exclude-module PIL.WebPImagePlugin `
            vox_app.py
      - name: Build installer
        working-directory: windows
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: VoxSetup, path: windows/Output/VoxSetup.exe }

  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0" > /dev/null
      - name: Signing key (from the ANDROID_KEYSTORE_B64 repository secret)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/vox.keystore
            echo "Using the project signing key"
            echo "APK_ARTIFACT=Vox-android" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::No ANDROID_KEYSTORE_B64 secret: refusing to build a release APK with a throw-away key (it could not update installed apps). Add the secret and push the tag again."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret. This build is signed with a throw-away key, so the APK cannot update earlier installs; it is uploaded as Vox-android-debug-key."
            echo "APK_ARTIFACT=Vox-android-debug-key" >> "$GITHUB_ENV"
          fi
      - name: Unit tests (android/run-tests.sh)
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" bash android/run-tests.sh
      - name: Sync client against the real relay (android/run-tests.sh --integration)
        # The test starts relay/relay.py itself (the runner's python3, a free port on 127.0.0.1, a temp data folder).
        # Nothing is downloaded.
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" bash android/run-tests.sh --integration
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        # The version the app shows (and Android compares) is the tag's: v1.4.2 -> versionName 1.4.2, versionCode 10402.
        # Only the runner's copy of the manifest changes; the committed one is not touched.
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]{1,2})(\.([0-9]{1,2}))?$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not like v1.4 or v1.4.2, so no Android version can be made from it."
            exit 1
          fi
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[4]:-0} ))
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"$v\"/; s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$code\"/" android/AndroidManifest.xml
          grep -E 'android:version(Name|Code)' android/AndroidManifest.xml
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" bash ./android/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ env.APK_ARTIFACT }}", path: android/build/Vox.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, relay, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/VoxSetup.exe
            out/Vox.apk
          body: |
            **Android:** download `Vox.apk` on your phone and open it. See the README for the one-time setup.
            **Windows:** download `VoxSetup.exe` and run it. Windows SmartScreen may warn because the installer is not code-signed: click *More info* > *Run anyway*.
            On first start Vox asks you to choose an AI provider (Groq is the default and has a free tier: https://console.groq.com/keys) and paste your own key. Each person uses their own key and their own limits.
